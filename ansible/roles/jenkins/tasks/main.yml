---
- name: Install Java
  ansible.builtin.dnf:
    name: "{{ jenkins_java_package }}"
    state: present

- name: Import Jenkins repository signing key
  ansible.builtin.rpm_key:
    key: "{{ jenkins_repo_key_url }}"
    state: present

- name: Configure Jenkins repository
  ansible.builtin.get_url:
    url: "{{ jenkins_repo_url }}"
    dest: /etc/yum.repos.d/jenkins.repo
    owner: root
    group: root
    mode: '0644'

- name: Install Jenkins
  ansible.builtin.dnf:
    name: jenkins
    state: present

- name: Allow Jenkins to run Docker builds
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true

- name: Enable and start Jenkins
  ansible.builtin.systemd:
    name: jenkins
    enabled: true
    state: started

