- name: Update installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - git
      - jq
      - unzip
    state: present

- name: Create DevOps directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/devops
    - /opt/devops/scripts

