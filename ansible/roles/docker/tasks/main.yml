---
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Enable Docker at boot
  ansible.builtin.systemd:
    name: docker
    enabled: true

- name: Start Docker
  ansible.builtin.systemd:
    name: docker
    state: started


